<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO & Open Graph ===== -->
    <title>Blog Post · Irtija</title>
    <meta name="description" content="Read the full story, insights, and technical deep-dives from Md. Irtija Azad Talha's journey in cybersecurity and development." />
    <meta property="og:title" content="Blog Post · Irtija" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://irtizaa6x.github.io/blog-detail" />
    <meta property="og:description" content="Detailed blog posts covering cybersecurity, development, and professional growth." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://irtizaa6x.github.io/blog-detail" />

    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- ===== Core Styles ===== -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="blogs.css" />

    <!-- ===== Required Libraries ===== -->
    <script src="config.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js" defer></script>

    <!-- ===== Minimal Page-specific Overrides ===== -->
    <style>
        body {
            background: var(--dust-grey, #dad7cd);
            padding: 2rem 1rem;
        }
        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            display: block;
        }
        .main-content {
            padding: 0;
            background: transparent;
        }
        .back-to-portfolio-wrapper {
            margin-bottom: 1.8rem;
        }
        .detail-footer {
            margin-top: 2.5rem;
            border-top: 1px solid rgba(52, 78, 65, 0.08);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .detail-footer .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted, #6a7a6a);
        }
        .detail-footer .footer-note i {
            color: var(--fern, #588157);
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.8rem;
            }
            .detail-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .detail-footer .back-to-portfolio {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <main class="main-content" id="mainContent">
            <!-- ===== DYNAMIC CONTENT CONTAINER ===== -->
            <article id="blogDetailContainer" class="blog-detail-container">
                <!-- Loading state -->
                <div class="blog-loading" style="padding:3rem 0;">
                    <i class="fas fa-spinner"></i>
                    <p>Loading post...</p>
                </div>
            </article>
        </main>
    </div>

    <!-- ============================================================
       MAIN SCRIPT — PRODUCTION-READY
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1.  CONFIGURATION (global fallback)
            // ============================================================

            const CONFIG = window.CONFIG || {
                GITHUB_USER: 'Irtizaa6x',
                GITHUB_REPO: 'Irtizaa6x.github.io',
                BRANCH: 'main',
                POSTS_PATH: 'src/posts',
                BLOG_DETAIL_PATH: '/blog-detail',
            };

            // ============================================================
            //  2.  HELPERS
            // ============================================================

            /**
             * Get a URL parameter by name.
             * @param {string} param – The parameter name.
             * @returns {string|null} – The value or null if not found.
             */
            function getParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            /**
             * Fetch with retry logic.
             */
            async function fetchWithRetry(url, retries = 3, delay = 1000) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response;
                } catch (error) {
                    if (retries <= 0) throw error;
                    console.warn(`Fetch retrying... (${retries} left)`, error.message);
                    await new Promise(r => setTimeout(r, delay));
                    return fetchWithRetry(url, retries - 1, delay * 1.5);
                }
            }

            /**
             * Parse YAML frontmatter from a Markdown string.
             */
            function parseFrontmatter(markdown) {
                const match = markdown.match(/^---\s*([\s\S]*?)\s*---/);
                if (!match) {
                    return { data: {}, content: markdown };
                }
                const frontmatter = match[1];
                const content = markdown.replace(match[0], '').trim();
                let data = {};

                try {
                    if (typeof jsyaml !== 'undefined' && jsyaml.load) {
                        data = jsyaml.load(frontmatter) || {};
                    } else {
                        // Fallback: simple key:value lines
                        const lines = frontmatter.split('\n');
                        const fallbackData = {};
                        lines.forEach(line => {
                            const colon = line.indexOf(':');
                            if (colon > 0) {
                                const key = line.slice(0, colon).trim();
                                let val = line.slice(colon + 1).trim();
                                if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                                if (val.startsWith("'") && val.endsWith("'")) val = val.slice(1, -1);
                                fallbackData[key] = val;
                            }
                        });
                        data = fallbackData;
                    }
                } catch (err) {
                    console.warn('YAML parse error:', err.message);
                    data = {};
                }

                return { data, content };
            }

            /**
             * Build a cache‑busted GitHub API URL for a single file.
             */
            function buildFileUrl(slug) {
                const path = `${CONFIG.POSTS_PATH}/${slug}.md`;
                return `https://api.github.com/repos/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/contents/${path}?ref=${CONFIG.BRANCH}&_t=${Date.now()}`;
            }

            // ============================================================
            //  3.  FETCH POST DATA
            // ============================================================

            async function fetchPost(slug) {
                try {
                    const url = buildFileUrl(slug);
                    const response = await fetchWithRetry(url);
                    const file = await response.json();
                    // The content is Base64‑encoded
                    const markdown = atob(file.content);
                    const { data, content } = parseFrontmatter(markdown);

                    // Normalise gallery: handle both string[] and object[] formats
                    let gallery = data.gallery || [];
                    if (Array.isArray(gallery) && gallery.length > 0) {
                        if (typeof gallery[0] === 'object' && gallery[0].image) {
                            gallery = gallery.map(item => item.image);
                        }
                    }

                    return { ...data, gallery, content };
                } catch (error) {
                    console.error('Error fetching post:', error);
                    return null;
                }
            }

            // ============================================================
            //  4.  GALLERY TOGGLE (exposed globally)
            // ============================================================

            window.toggleGallery = function() {
                const gallery = document.getElementById('galleryContainer');
                const btn = document.querySelector('.gallery-toggle-btn');
                if (!gallery || !btn) return;

                if (gallery.style.display === 'none' || gallery.style.display === '') {
                    gallery.style.display = 'grid';
                    btn.innerHTML = '<i class="fas fa-times"></i> Hide Gallery';
                } else {
                    gallery.style.display = 'none';
                    const count = gallery.children.length;
                    btn.innerHTML = `<i class="fas fa-images"></i> View Gallery (${count} images)`;
                }
            };

            // ============================================================
            //  5.  RENDER DETAIL
            // ============================================================

            async function renderDetail() {
                const slug = getParam('slug');
                const container = document.getElementById('blogDetailContainer');
                if (!container) return;

                if (!slug) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:3rem 1rem;">
                            <p style="color:#b91c1c;font-weight:600;">❌ No blog post selected.</p>
                            <a href="/blog.html" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                                <i class="fas fa-arrow-left"></i> Back to Blog
                            </a>
                        </div>
                    `;
                    return;
                }

                const post = await fetchPost(slug);
                if (!post) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:3rem 1rem;">
                            <p style="color:#b91c1c;font-weight:600;">❌ Post not found.</p>
                            <a href="/blog.html" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                                <i class="fas fa-arrow-left"></i> Back to Blog
                            </a>
                        </div>
                    `;
                    return;
                }

                // --- Update document title & meta ---
                document.title = `${post.title || 'Blog Post'} · Irtija`;
                const metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) {
                    metaDesc.setAttribute('content', post.previewText || post.title || 'Read the full blog post.');
                }
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.setAttribute('content', `${post.title || 'Blog Post'} · Irtija`);

                // --- Cover image ---
                const coverHtml = post.coverImage
                    ? `<figure><img src="${post.coverImage}" alt="${post.title}" class="detail-cover" loading="lazy" /></figure>`
                    : '';

                // --- Date (semantic time) ---
                const dateHtml = post.date
                    ? `<p class="detail-date"><i class="far fa-calendar-alt"></i> <time datetime="${post.date}">${post.date}</time></p>`
                    : '';

                // --- Tags ---
                let tagsHtml = '';
                if (post.tags && post.tags.length) {
                    tagsHtml = `<div class="detail-tags">${post.tags.map(t => `<span>#${t}</span>`).join('')}</div>`;
                }

                // --- Gallery ---
                let galleryHtml = '';
                if (post.gallery && post.gallery.length > 0) {
                    const allImages = post.gallery.map(img =>
                        `<img src="${img}" alt="Gallery image" loading="lazy" />`
                    ).join('');

                    galleryHtml = `
                        <div class="detail-gallery-container">
                            <button class="gallery-toggle-btn" onclick="toggleGallery()">
                                <i class="fas fa-times"></i> Hide Gallery
                            </button>
                            <div class="detail-gallery" id="galleryContainer" style="display:grid;">
                                ${allImages}
                            </div>
                        </div>
                    `;
                }

                // --- Video embed ---
                let videoHtml = '';
                if (post.videoURL) {
                    let embedUrl = post.videoURL;
                    if (post.videoURL.includes('watch?v=')) {
                        embedUrl = post.videoURL.replace('watch?v=', 'embed/');
                    } else if (post.videoURL.includes('youtu.be/')) {
                        embedUrl = post.videoURL.replace('youtu.be/', 'youtube.com/embed/');
                    }
                    if (embedUrl.includes('youtube')) {
                        videoHtml = `
                            <div class="detail-video">
                                <iframe src="${embedUrl}" frameborder="0" allowfullscreen loading="lazy" title="Embedded video"></iframe>
                            </div>
                        `;
                    }
                }

                // --- Certificate button ---
                let certHtml = '';
                if (post.certificate) {
                    certHtml = `
                        <a href="${post.certificate}" target="_blank" class="detail-cert-btn" rel="noopener noreferrer">
                            <i class="fas fa-certificate"></i> View Certificate
                        </a>
                    `;
                }

                // --- Body (Markdown -> HTML) with safe fallback ---
                let bodyHtml = '';
                if (post.content) {
                    try {
                        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                            bodyHtml = marked.parse(post.content);
                        } else {
                            // Fallback: simple markdown-ish rendering
                            bodyHtml = post.content
                                .split('\n\n')
                                .filter(p => p.trim())
                                .map(p => `<p>${p.replace(/\n/g, '<br />')}</p>`)
                                .join('');
                        }
                    } catch (err) {
                        console.warn('Markdown parsing failed:', err);
                        bodyHtml = `<p>${post.content.replace(/\n/g, '<br />')}</p>`;
                    }
                }

                // --- Assemble full HTML using semantic tags ---
                container.innerHTML = `
                    <!-- Back button (top) -->
                    <div class="back-to-portfolio-wrapper">
                        <a href="/blog.html" class="back-to-portfolio" aria-label="Back to blog listing">
                            <i class="fas fa-arrow-left"></i> Back to Blog
                        </a>
                    </div>

                    ${coverHtml}

                    <header>
                        <h1 class="detail-title">${post.title || 'Untitled'}</h1>
                        ${dateHtml}
                        ${tagsHtml}
                    </header>

                    <section class="detail-body">
                        ${bodyHtml}
                    </section>

                    ${galleryHtml}
                    ${videoHtml}
                    ${certHtml}

                    <!-- Footer with back button -->
                    <footer class="detail-footer">
                        <span class="footer-note">
                            <i class="fas fa-feather-alt"></i> Published via Irtija's Admin Panel
                        </span>
                        <a href="/blog.html" class="back-to-portfolio" style="margin:0;" aria-label="Back to blog listing">
                            <i class="fas fa-arrow-left"></i> Back to Blog
                        </a>
                    </footer>
                `;
            }

            // ============================================================
            //  6.  BOOTSTRAP
            // ============================================================

            // Wait for the DOM and the required libraries to load
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderDetail);
            } else {
                renderDetail();
            }

            // Handle library load failures gracefully (re-run if marked loads later)
            let markedCheckInterval = setInterval(() => {
                if (typeof marked !== 'undefined') {
                    clearInterval(markedCheckInterval);
                    // Re-render only if not already rendered with fallback
                    const container = document.getElementById('blogDetailContainer');
                    if (container && container.querySelector('.detail-body p') && !container.querySelector('.detail-body h2')) {
                        // If it seems like fallback was used, re-render
                        renderDetail();
                    }
                }
            }, 500);

            // Stop checking after 10 seconds
            setTimeout(() => clearInterval(markedCheckInterval), 10000);

        })();
    </script>

</body>
</html>
