<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Detail · Irtija</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- Core Styles -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="blogs.css" />

    <!-- ===== REQUIRED: js-yaml for frontmatter parsing ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <!-- ===== REQUIRED: marked for Markdown rendering ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js"></script>

    <style>
        /* Minimal page-level overrides — everything else comes from blogs.css */
        body {
            background: var(--alabaster, #dce1de);
            padding: 2rem 1rem;
        }

        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            display: block;
        }

        .main-content {
            padding: 0;
            background: transparent;
        }

        /* Additional spacing for the back button container */
        .back-to-portfolio-wrapper {
            margin-bottom: 1.8rem;
        }

        /* Footer spacing */
        .detail-footer {
            margin-top: 2.5rem;
            border-top: 1px solid rgba(31, 36, 33, 0.06);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .detail-footer .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted, #6a7a7a);
        }

        .detail-footer .footer-note i {
            color: var(--seaweed, #49a078);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.8rem;
            }
            .detail-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .detail-footer .back-to-portfolio {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <main class="main-content" id="mainContent">
            <div id="blogDetailContainer" class="blog-detail-container">
                <!-- Loading state -->
                <div class="blog-loading" style="padding:3rem 0;">
                    <i class="fas fa-spinner"></i>
                    <p>Loading post...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  CONFIGURATION
        // ============================================================
        const GITHUB_USER = "Irtizaa6x";
        const GITHUB_REPO = "Irtizaa6x.github.io";
        const BRANCH = "main";

        // ============================================================
        //  HELPERS
        // ============================================================
        function getParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // ============================================================
        //  PARSER: Uses js-yaml for robust frontmatter parsing
        // ============================================================
        function parseFrontmatter(markdown) {
            const match = markdown.match(/^---\s*([\s\S]*?)\s*---/);
            if (!match) {
                return { data: {}, content: markdown };
            }

            const frontmatter = match[1];
            const content = markdown.replace(match[0], '').trim();
            let data = {};

            try {
                data = jsyaml.load(frontmatter) || {};
            } catch (err) {
                console.warn('YAML parse error:', err.message);
                // Fallback: simple key:value parsing
                const lines = frontmatter.split('\n');
                const fallbackData = {};
                lines.forEach(line => {
                    const colon = line.indexOf(':');
                    if (colon > 0) {
                        const key = line.slice(0, colon).trim();
                        let val = line.slice(colon + 1).trim();
                        if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                        if (val.startsWith("'") && val.endsWith("'")) val = val.slice(1, -1);
                        fallbackData[key] = val;
                    }
                });
                data = fallbackData;
            }

            return { data, content };
        }

        // ============================================================
        //  API: Fetch a single post by slug
        // ============================================================
        async function fetchPost(slug) {
            try {
                const url =
                    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/src/posts/${slug}.md?ref=${BRANCH}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Post not found');
                const file = await response.json();
                const markdown = atob(file.content);
                const { data, content } = parseFrontmatter(markdown);

                // Normalise gallery: handle both string[] and object[] formats
                let gallery = data.gallery || [];
                if (Array.isArray(gallery) && gallery.length > 0) {
                    if (typeof gallery[0] === 'object' && gallery[0].image) {
                        gallery = gallery.map(item => item.image);
                    }
                }

                return { ...data, gallery, content };
            } catch (error) {
                console.error('Error fetching post:', error);
                return null;
            }
        }

        // ============================================================
        //  TOGGLE GALLERY
        // ============================================================
        function toggleGallery() {
            const gallery = document.getElementById('galleryContainer');
            const btn = document.querySelector('.gallery-toggle-btn');
            if (!gallery || !btn) return;

            if (gallery.style.display === 'none' || gallery.style.display === '') {
                gallery.style.display = 'grid';
                btn.innerHTML = '<i class="fas fa-times"></i> Hide Gallery';
            } else {
                gallery.style.display = 'none';
                const count = gallery.children.length;
                btn.innerHTML = `<i class="fas fa-images"></i> View Gallery (${count} images)`;
            }
        }

        // ============================================================
        //  RENDER DETAIL
        // ============================================================
        async function renderDetail() {
            const slug = getParam('slug');
            const container = document.getElementById('blogDetailContainer');

            if (!slug) {
                container.innerHTML = `
                    <div style="text-align:center;padding:3rem 1rem;">
                        <p style="color:#b91c1c;font-weight:600;">❌ No blog post selected.</p>
                        <a href="/#blog" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                            <i class="fas fa-arrow-left"></i> Back to Portfolio
                        </a>
                    </div>
                `;
                return;
            }

            const post = await fetchPost(slug);
            if (!post) {
                container.innerHTML = `
                    <div style="text-align:center;padding:3rem 1rem;">
                        <p style="color:#b91c1c;font-weight:600;">❌ Post not found.</p>
                        <a href="/#blog-page" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                            <i class="fas fa-arrow-left"></i> Back to Portfolio
                        </a>
                    </div>
                `;
                return;
            }

            // --- COVER ---
            const coverHtml = post.coverImage
                ? `<img src="${post.coverImage}" alt="${post.title}" class="detail-cover" loading="lazy" />`
                : '';

            // --- DATE ---
            const dateHtml = post.date
                ? `<p class="detail-date"><i class="far fa-calendar-alt"></i> ${post.date}</p>`
                : '';

            // --- TAGS ---
            let tagsHtml = '';
            if (post.tags && post.tags.length) {
                tagsHtml = `<div class="detail-tags">${post.tags.map(t => `<span>#${t}</span>`).join('')}</div>`;
            }

            // --- GALLERY (with toggle, visible by default) ---
            let galleryHtml = '';
            let galleryCount = 0;
            if (post.gallery && post.gallery.length > 0) {
                galleryCount = post.gallery.length;
                const firstImage = post.gallery[0];
                const remainingCount = galleryCount - 1;
                const allImages = post.gallery.map(img =>
                    `<img src="${img}" alt="Gallery image" loading="lazy" />`
                ).join('');

                galleryHtml = `
                    <div class="detail-gallery-container">
                        <div class="detail-gallery-preview">
                            <img src="${firstImage}" alt="Gallery preview" loading="lazy" />
                            ${remainingCount > 0 ? `<span class="gallery-count">+${remainingCount} more</span>` : ''}
                        </div>
                        <button class="gallery-toggle-btn" onclick="toggleGallery()">
                            <i class="fas fa-times"></i> Hide Gallery
                        </button>
                        <div class="detail-gallery" id="galleryContainer" style="display:grid;">
                            ${allImages}
                        </div>
                    </div>
                `;
            }

            // --- VIDEO ---
            let videoHtml = '';
            if (post.videoURL) {
                let embedUrl = post.videoURL;
                if (post.videoURL.includes('watch?v=')) {
                    embedUrl = post.videoURL.replace('watch?v=', 'embed/');
                } else if (post.videoURL.includes('youtu.be/')) {
                    embedUrl = post.videoURL.replace('youtu.be/', 'youtube.com/embed/');
                }
                if (embedUrl.includes('youtube')) {
                    videoHtml =
                        `<div class="detail-video"><iframe src="${embedUrl}" frameborder="0" allowfullscreen loading="lazy"></iframe></div>`;
                }
            }

            // --- CERTIFICATE ---
            let certHtml = '';
            if (post.certificate) {
                certHtml =
                    `<a href="${post.certificate}" target="_blank" class="detail-cert-btn"><i class="fas fa-certificate"></i> View Certificate</a>`;
            }

            // --- BODY (Markdown) ---
            const bodyHtml = post.content ? marked.parse(post.content) : '';

            // --- FULL HTML ---
            container.innerHTML = `
                <!-- Back button (top) -->
                <div class="back-to-portfolio-wrapper">
                    <a href="/#blog-page" class="back-to-portfolio">
                        <i class="fas fa-arrow-left"></i> Back to Blog
                    </a>
                </div>

                ${coverHtml}
                <h1 class="detail-title">${post.title}</h1>
                ${dateHtml}
                ${tagsHtml}
                <div class="detail-body">${bodyHtml}</div>
                ${galleryHtml}
                ${videoHtml}
                ${certHtml}

                <!-- Footer with back button -->
                <div class="detail-footer">
                    <span class="footer-note">
                        <i class="fas fa-feather-alt"></i> Published via Irtija's Admin Panel
                    </span>
                    <a href="/#blog-page" class="back-to-portfolio" style="margin:0;">
                        <i class="fas fa-arrow-left"></i> Back to Blog
                    </a>
                </div>
            `;
        }

        // ============================================================
        //  INIT
        // ============================================================
        renderDetail();
    </script>
</body>
</html>
