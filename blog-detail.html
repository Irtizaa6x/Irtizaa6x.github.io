<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Detail · Irtija</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="blogs.css" />

    <!-- ===== REQUIRED: js-yaml for robust frontmatter parsing ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <!-- ===== REQUIRED: marked for Markdown rendering ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js"></script>

    <style>
        /* ----- BASE ----- */
        body {
            background: var(--alabaster, #dce1de);
            padding: 2rem 1rem;
        }
        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: block;
        }
        .main-content {
            padding: 0;
            background: transparent;
        }

        /* ----- BACK BUTTON ----- */
        .back-to-portfolio {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            color: var(--stormy, #216869);
            font-weight: 600;
            text-decoration: none;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(33, 104, 105, 0.15);
            border-radius: 40px;
            transition: all 0.3s ease;
            background: #fff;
        }
        .back-to-portfolio:hover {
            background: var(--stormy);
            color: white;
            border-color: var(--stormy);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(33, 104, 105, 0.10);
        }

        /* ----- COVER IMAGE ----- */
        .blog-detail-container .detail-cover {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: var(--radius-sm, 10px);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: block;
        }

        /* ----- TITLE & DATE ----- */
        .blog-detail-container .detail-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-primary, #1a2a2a);
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }
        .blog-detail-container .detail-date {
            color: var(--text-muted, #6a7a7a);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        /* ----- TAGS ----- */
        .blog-detail-container .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }
        .blog-detail-container .detail-tags span {
            background: rgba(156, 197, 161, 0.12);
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--stormy, #216869);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid rgba(33, 104, 105, 0.06);
        }

        /* ----- BODY CONTENT ----- */
        .blog-detail-container .detail-body {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary, #3a4a4a);
        }
        .blog-detail-container .detail-body h2,
        .blog-detail-container .detail-body h3 {
            color: var(--text-primary);
            margin-top: 1.5rem;
            font-family: 'Playfair Display', serif;
        }
        .blog-detail-container .detail-body ul,
        .blog-detail-container .detail-body ol {
            padding-left: 1.5rem;
        }
        .blog-detail-container .detail-body blockquote {
            border-left: 4px solid var(--seaweed, #49a078);
            padding-left: 1rem;
            margin-left: 0;
            color: var(--text-secondary);
            background: rgba(73, 160, 120, 0.03);
            padding: 0.8rem 1rem;
            border-radius: 0 8px 8px 0;
        }
        .blog-detail-container .detail-body img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 0.8rem 0;
        }
        .blog-detail-container .detail-body pre {
            background: var(--carbon, #1f2421);
            color: #dce1de;
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.85rem;
        }
        .blog-detail-container .detail-body code {
            background: rgba(31, 36, 33, 0.06);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* ===== GALLERY ===== */
        .detail-gallery-container {
            margin: 1.5rem 0;
        }
        .detail-gallery-preview {
            position: relative;
            border-radius: var(--radius-sm, 10px);
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 0.8rem;
        }
        .detail-gallery-preview img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: var(--radius-sm, 10px);
        }
        .detail-gallery-preview .gallery-count {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(31, 36, 33, 0.8);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .gallery-toggle-btn {
            background: var(--bg-card, #ffffff);
            border: 1px solid rgba(33, 104, 105, 0.15);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--stormy, #216869);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0.5rem 0;
            font-family: inherit;
        }
        .gallery-toggle-btn:hover {
            background: var(--stormy, #216869);
            color: #fff;
            border-color: var(--stormy);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(33, 104, 105, 0.15);
        }
        .detail-gallery {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-top: 1rem;
            animation: fadeUp 0.4s ease;
        }
        .detail-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-sm, 10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .detail-gallery img:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-glow, 0 8px 32px rgba(73, 160, 120, 0.10));
        }

        /* ===== VIDEO ===== */
        .detail-video {
            margin: 1.5rem 0;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: var(--radius-sm, 10px);
            box-shadow: var(--shadow-sm);
        }
        .detail-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ===== CERTIFICATE BUTTON ===== */
        .detail-cert-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1rem;
            background: var(--stormy, #216869);
            color: #ffffff;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid var(--stormy, #216869);
            font-family: inherit;
        }
        .detail-cert-btn:hover {
            background: var(--seaweed, #49a078);
            border-color: var(--seaweed, #49a078);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(73, 160, 120, 0.20);
            color: #ffffff;
        }
        .detail-cert-btn i {
            font-size: 0.9rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.8rem;
            }
            .blog-detail-container .detail-title {
                font-size: 1.6rem;
            }
            .blog-detail-container .detail-cover {
                max-height: 300px;
            }
            .detail-gallery {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            .gallery-toggle-btn {
                font-size: 0.75rem;
                padding: 0.4rem 1rem;
            }
            .detail-cert-btn {
                font-size: 0.75rem;
                padding: 0.4rem 1.2rem;
            }
            .back-to-portfolio {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .blog-detail-container .detail-title {
                font-size: 1.3rem;
            }
            .detail-gallery {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <main class="main-content" id="mainContent">
            <a href="index.html" class="back-to-portfolio"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
            <div id="blogDetailContainer" class="blog-detail-container">
                <p style="text-align:center;color:var(--text-muted);padding:3rem 0;">Loading post...</p>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  CONFIGURATION
        // ============================================================
        const GITHUB_USER = "Irtizaa6x";
        const GITHUB_REPO = "Irtizaa6x.github.io";
        const BRANCH = "main";

        // ============================================================
        //  HELPERS
        // ============================================================
        function getParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // ============================================================
        //  PARSER: Uses js-yaml for robust frontmatter parsing
        // ============================================================
        function parseFrontmatter(markdown) {
            const match = markdown.match(/^---\s*([\s\S]*?)\s*---/);
            if (!match) {
                return { data: {}, content: markdown };
            }

            const frontmatter = match[1];
            const content = markdown.replace(match[0], '').trim();
            let data = {};

            try {
                data = jsyaml.load(frontmatter) || {};
            } catch (err) {
                console.warn('YAML parse error:', err.message);
                // Fallback: simple key:value parsing
                const lines = frontmatter.split('\n');
                const fallbackData = {};
                lines.forEach(line => {
                    const colon = line.indexOf(':');
                    if (colon > 0) {
                        const key = line.slice(0, colon).trim();
                        let val = line.slice(colon + 1).trim();
                        if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                        if (val.startsWith("'") && val.endsWith("'")) val = val.slice(1, -1);
                        fallbackData[key] = val;
                    }
                });
                data = fallbackData;
            }

            return { data, content };
        }

        // ============================================================
        //  API: Fetch a single post by slug
        // ============================================================
        async function fetchPost(slug) {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/src/posts/${slug}.md?ref=${BRANCH}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Post not found');
                const file = await response.json();
                const markdown = atob(file.content);
                const { data, content } = parseFrontmatter(markdown);

                // Normalise gallery: handle both string[] and object[] formats
                let gallery = data.gallery || [];
                if (Array.isArray(gallery) && gallery.length > 0) {
                    if (typeof gallery[0] === 'object' && gallery[0].image) {
                        gallery = gallery.map(item => item.image);
                    }
                }

                return { ...data, gallery, content };
            } catch (error) {
                console.error('Error fetching post:', error);
                return null;
            }
        }

        // ============================================================
        //  TOGGLE GALLERY
        // ============================================================
        function toggleGallery() {
            const gallery = document.getElementById('galleryContainer');
            const btn = document.querySelector('.gallery-toggle-btn');
            if (!gallery || !btn) return;
            if (gallery.style.display === 'none' || gallery.style.display === '') {
                gallery.style.display = 'grid';
                btn.innerHTML = '<i class="fas fa-times"></i> Hide Gallery';
            } else {
                gallery.style.display = 'none';
                const count = gallery.children.length;
                btn.innerHTML = `<i class="fas fa-images"></i> View Gallery (${count} images)`;
            }
        }

        // ============================================================
        //  RENDER DETAIL
        // ============================================================
        async function renderDetail() {
            const slug = getParam('slug');
            const container = document.getElementById('blogDetailContainer');
            if (!slug) {
                container.innerHTML = `
                    <p style="text-align:center;color:red;">No blog post selected.</p>
                    <a href="index.html" class="back-to-portfolio">Go back</a>
                `;
                return;
            }

            const post = await fetchPost(slug);
            if (!post) {
                container.innerHTML = `
                    <p style="text-align:center;color:red;">Post not found.</p>
                    <a href="index.html" class="back-to-portfolio">Go back</a>
                `;
                return;
            }

            // --- COVER ---
            const coverHtml = post.coverImage
                ? `<img src="${post.coverImage}" alt="${post.title}" class="detail-cover" />`
                : '';

            // --- DATE ---
            const dateHtml = post.date
                ? `<p class="detail-date"><i class="far fa-calendar-alt"></i> ${post.date}</p>`
                : '';

            // --- TAGS ---
            let tagsHtml = '';
            if (post.tags && post.tags.length) {
                tagsHtml = `<div class="detail-tags">${post.tags.map(t => `<span>#${t}</span>`).join('')}</div>`;
            }

            // --- GALLERY ---
            let galleryHtml = '';
            if (post.gallery && post.gallery.length > 0) {
                const firstImage = post.gallery[0];
                const remainingCount = post.gallery.length - 1;
                const allImages = post.gallery.map(img => `<img src="${img}" alt="Gallery" loading="lazy" />`).join('');

                galleryHtml = `
                    <div class="detail-gallery-container">
                        <div class="detail-gallery-preview">
                            <img src="${firstImage}" alt="Gallery preview" loading="lazy" />
                            ${remainingCount > 0 ? `<span class="gallery-count">+${remainingCount} more</span>` : ''}
                        </div>
                        <button class="gallery-toggle-btn" onclick="toggleGallery()">
                            <i class="fas fa-images"></i> View Gallery (${post.gallery.length} images)
                        </button>
                        <div class="detail-gallery" id="galleryContainer">
                            ${allImages}
                        </div>
                    </div>
                `;
            }

            // --- VIDEO ---
            let videoHtml = '';
            if (post.videoURL) {
                let embedUrl = post.videoURL;
                if (post.videoURL.includes('watch?v=')) {
                    embedUrl = post.videoURL.replace('watch?v=', 'embed/');
                } else if (post.videoURL.includes('youtu.be/')) {
                    embedUrl = post.videoURL.replace('youtu.be/', 'youtube.com/embed/');
                }
                if (embedUrl.includes('youtube')) {
                    videoHtml = `<div class="detail-video"><iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe></div>`;
                }
            }

            // --- CERTIFICATE ---
            let certHtml = '';
            if (post.certificate) {
                certHtml = `<a href="${post.certificate}" target="_blank" class="detail-cert-btn"><i class="fas fa-certificate"></i> View Certificate</a>`;
            }

            // --- BODY (Markdown) ---
            const bodyHtml = post.content ? marked.parse(post.content) : '';

            container.innerHTML = `
                ${coverHtml}
                <h1 class="detail-title">${post.title}</h1>
                ${dateHtml}
                ${tagsHtml}
                <div class="detail-body">${bodyHtml}</div>
                ${galleryHtml}
                ${videoHtml}
                ${certHtml}
                <div style="margin-top:2rem;border-top:1px solid rgba(31,36,33,0.06);padding-top:1rem;">
                    <a href="index.html" class="back-to-portfolio"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
                </div>
            `;
        }

        // ============================================================
        //  INIT
        // ============================================================
        renderDetail();
    </script>
</body>
</html>
