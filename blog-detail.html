<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post · IrtiJa</title>

    <!-- ===== SEO & Open Graph ===== -->
    <meta name="description" content="Read the latest blog post from Md. Irtija Azad Talha — cybersecurity, technology, and personal journey." />
    <meta name="keywords" content="blog, cybersecurity, programming, Irtija, portfolio" />
    <link rel="canonical" href="https://irtizaa6x.github.io/blog-detail" />

    <meta property="og:title" content="Blog Post · IrtiJa" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://irtizaa6x.github.io/blog-detail" />
    <meta property="og:description" content="Read the latest blog post from Md. Irtija Azad Talha." />
    <meta property="og:image" content="https://irtizaa6x.github.io/irtija.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blog Post · IrtiJa" />
    <meta name="twitter:description" content="Read the latest blog post from Md. Irtija Azad Talha." />
    <meta name="twitter:image" content="https://irtizaa6x.github.io/irtija.png" />

    <!-- ===== JSON-LD Structured Data (Article) ===== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "Blog Post",
        "author": {
            "@type": "Person",
            "name": "Md. Irtija Azad Talha"
        },
        "publisher": {
            "@type": "Organization",
            "name": "IrtiJa Portfolio"
        },
        "datePublished": "2026-07-03",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://irtizaa6x.github.io/blog-detail"
        }
    }
    </script>

    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- ===== Core Styles ===== -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="blogs.css" />

    <!-- ===== Required Libraries ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js" defer></script>

    <!-- ===== Minimal Page‑specific Overrides ===== -->
    <style>
        /* Ensure the detail page uses the full width and proper spacing */
        body {
            background: var(--bg-body, #F0EDE5);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .main-content {
            padding: 0;
            background: transparent;
        }

        /* Back button wrapper */
        .back-to-portfolio-wrapper {
            margin-bottom: 1.8rem;
        }

        /* Detail footer */
        .detail-footer {
            margin-top: 2.5rem;
            border-top: 1px solid rgba(0, 70, 67, 0.06);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .detail-footer .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted, #7A7A7A);
        }

        .detail-footer .footer-note i {
            color: var(--gold, #D4A853);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.8rem;
            }
            .detail-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .detail-footer .back-to-portfolio {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <main class="main-content" id="mainContent" role="main">

            <!-- ===== DYNAMIC CONTENT CONTAINER ===== -->
            <article id="blogDetailContainer" class="blog-detail-container" aria-label="Blog post content">
                <!-- Loading state -->
                <div class="blog-loading" style="padding:3rem 0;" aria-live="polite">
                    <i class="fas fa-spinner" aria-hidden="true"></i>
                    <p>Loading post…</p>
                </div>
            </article>

        </main>
    </div>

    <!-- ============================================================
       MAIN SCRIPT — Fetches and renders the post
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1.  CONFIGURATION (matching blogs.js)
            // ============================================================

            const CONFIG = window.CONFIG || {
                GITHUB_USER: 'Irtizaa6x',
                GITHUB_REPO: 'Irtizaa6x.github.io',
                BRANCH: 'main',
                POSTS_PATH: 'src/posts',
                DETAIL_PAGE: '/blog-detail',
            };

            // ============================================================
            //  2.  HELPERS
            // ============================================================

            function getParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            function parseFrontmatter(markdown) {
                const match = markdown.match(/^---\s*([\s\S]*?)\s*---/);
                if (!match) {
                    return { data: {}, content: markdown };
                }
                const frontmatter = match[1];
                const content = markdown.replace(match[0], '').trim();
                let data = {};

                try {
                    if (typeof jsyaml !== 'undefined' && jsyaml.load) {
                        data = jsyaml.load(frontmatter) || {};
                    } else {
                        // Fallback: simple key:value lines
                        const lines = frontmatter.split('\n');
                        const fallbackData = {};
                        lines.forEach(line => {
                            const colon = line.indexOf(':');
                            if (colon > 0) {
                                const key = line.slice(0, colon).trim();
                                let val = line.slice(colon + 1).trim();
                                if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                                if (val.startsWith("'") && val.endsWith("'")) val = val.slice(1, -1);
                                fallbackData[key] = val;
                            }
                        });
                        data = fallbackData;
                    }
                } catch (err) {
                    console.warn('YAML parse error:', err.message);
                    data = {};
                }

                return { data, content };
            }

            function buildFileUrl(slug) {
                const path = `${CONFIG.POSTS_PATH}/${slug}.md`;
                return `https://api.github.com/repos/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/contents/${path}?ref=${CONFIG.BRANCH}&_t=${Date.now()}`;
            }

            // ============================================================
            //  3.  FETCH POST DATA (with retry)
            // ============================================================

            async function fetchWithRetry(url, retries = 3, delay = 1000) {
                for (let attempt = 1; attempt <= retries; attempt++) {
                    try {
                        const response = await fetch(url);
                        if (response.ok) return response;
                        if (response.status === 403 && response.headers.get('X-RateLimit-Remaining') === '0') {
                            const reset = response.headers.get('X-RateLimit-Reset');
                            if (reset) {
                                const waitTime = (parseInt(reset, 10) * 1000) - Date.now() + 5000;
                                if (waitTime > 0) {
                                    console.warn(`GitHub rate limit hit. Waiting ${Math.ceil(waitTime / 1000)}s...`);
                                    await new Promise(r => setTimeout(r, waitTime));
                                    continue;
                                }
                            }
                        }
                        throw new Error(`HTTP ${response.status}`);
                    } catch (err) {
                        if (attempt === retries) throw err;
                        const backoff = delay * Math.pow(2, attempt - 1);
                        console.warn(`Fetch attempt ${attempt} failed. Retrying in ${backoff}ms...`);
                        await new Promise(r => setTimeout(r, backoff));
                    }
                }
            }

            async function fetchPost(slug) {
                try {
                    const url = buildFileUrl(slug);
                    const response = await fetchWithRetry(url);
                    const file = await response.json();
                    const markdown = atob(file.content);
                    const { data, content } = parseFrontmatter(markdown);

                    // Normalise gallery
                    let gallery = data.gallery || [];
                    if (Array.isArray(gallery) && gallery.length > 0) {
                        if (typeof gallery[0] === 'object' && gallery[0].image) {
                            gallery = gallery.map(item => item.image);
                        }
                    }

                    return { ...data, gallery, content };
                } catch (error) {
                    console.error('Error fetching post:', error);
                    return null;
                }
            }

            // ============================================================
            //  4.  GALLERY TOGGLE
            // ============================================================

            function toggleGallery() {
                const gallery = document.getElementById('galleryContainer');
                const btn = document.querySelector('.gallery-toggle-btn');
                if (!gallery || !btn) return;

                if (gallery.style.display === 'none' || gallery.style.display === '') {
                    gallery.style.display = 'grid';
                    btn.innerHTML = '<i class="fas fa-times"></i> Hide Gallery';
                } else {
                    gallery.style.display = 'none';
                    const count = gallery.children.length;
                    btn.innerHTML = `<i class="fas fa-images"></i> View Gallery (${count} images)`;
                }
            }
            window.toggleGallery = toggleGallery;

            // ============================================================
            //  5.  RENDER DETAIL
            // ============================================================

            async function renderDetail() {
                const slug = getParam('slug');
                const container = document.getElementById('blogDetailContainer');
                if (!container) return;

                if (!slug) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:3rem 1rem;">
                            <p style="color:#b91c1c;font-weight:600;">❌ No blog post selected.</p>
                            <a href="/blog.html" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                                <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Blog
                            </a>
                        </div>
                    `;
                    return;
                }

                const post = await fetchPost(slug);
                if (!post) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:3rem 1rem;">
                            <p style="color:#b91c1c;font-weight:600;">❌ Post not found.</p>
                            <a href="/blog.html" class="back-to-portfolio" style="margin-top:1.2rem;display:inline-flex;">
                                <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Blog
                            </a>
                        </div>
                    `;
                    return;
                }

                // --- Update document metadata dynamically ---
                document.title = `${post.title || 'Blog Post'} · IrtiJa`;
                const metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc && post.previewText) {
                    metaDesc.setAttribute('content', post.previewText);
                }
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.setAttribute('content', post.title || 'Blog Post · IrtiJa');
                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogDesc && post.previewText) {
                    ogDesc.setAttribute('content', post.previewText);
                }
                if (post.coverImage) {
                    const ogImage = document.querySelector('meta[property="og:image"]');
                    if (ogImage) ogImage.setAttribute('content', post.coverImage);
                    const twitterImage = document.querySelector('meta[name="twitter:image"]');
                    if (twitterImage) twitterImage.setAttribute('content', post.coverImage);
                }
                // Update JSON-LD
                const jsonLd = document.querySelector('script[type="application/ld+json"]');
                if (jsonLd) {
                    try {
                        const data = JSON.parse(jsonLd.textContent);
                        data.headline = post.title || 'Blog Post';
                        if (post.date) data.datePublished = post.date;
                        if (post.coverImage) data.image = post.coverImage;
                        jsonLd.textContent = JSON.stringify(data, null, 2);
                    } catch (e) { /* ignore */ }
                }

                // --- Cover image ---
                const coverHtml = post.coverImage
                    ? `<img src="${post.coverImage}" alt="${post.title || 'Cover image'}" class="detail-cover" loading="lazy" />`
                    : '';

                // --- Date ---
                const dateHtml = post.date
                    ? `<p class="detail-date"><i class="far fa-calendar-alt" aria-hidden="true"></i> ${post.date}</p>`
                    : '';

                // --- Tags ---
                let tagsHtml = '';
                if (post.tags && post.tags.length) {
                    tagsHtml = `<div class="detail-tags">${post.tags.map(t => `<span>#${t}</span>`).join('')}</div>`;
                }

                // --- Gallery ---
                let galleryHtml = '';
                if (post.gallery && post.gallery.length > 0) {
                    const allImages = post.gallery.map(img =>
                        `<img src="${img}" alt="Gallery image" loading="lazy" />`
                    ).join('');

                    galleryHtml = `
                        <div class="detail-gallery-container">
                            <button class="gallery-toggle-btn" onclick="toggleGallery()" aria-label="Toggle gallery">
                                <i class="fas fa-times" aria-hidden="true"></i> Hide Gallery
                            </button>
                            <div class="detail-gallery" id="galleryContainer" style="display:grid;">
                                ${allImages}
                            </div>
                        </div>
                    `;
                }

                // --- Video embed ---
                let videoHtml = '';
                if (post.videoURL) {
                    let embedUrl = post.videoURL;
                    if (post.videoURL.includes('watch?v=')) {
                        embedUrl = post.videoURL.replace('watch?v=', 'embed/');
                    } else if (post.videoURL.includes('youtu.be/')) {
                        embedUrl = post.videoURL.replace('youtu.be/', 'youtube.com/embed/');
                    }
                    if (embedUrl.includes('youtube')) {
                        videoHtml = `
                            <div class="detail-video">
                                <iframe src="${embedUrl}" frameborder="0" allowfullscreen loading="lazy" title="Video content"></iframe>
                            </div>
                        `;
                    }
                }

                // --- Certificate button ---
                let certHtml = '';
                if (post.certificate) {
                    certHtml = `
                        <a href="${post.certificate}" target="_blank" class="detail-cert-btn" rel="noopener noreferrer">
                            <i class="fas fa-certificate" aria-hidden="true"></i> View Certificate
                        </a>
                    `;
                }

                // --- Body (Markdown -> HTML) ---
                let bodyHtml = '';
                if (post.content) {
                    try {
                        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                            bodyHtml = marked.parse(post.content);
                        } else {
                            // Fallback: simple paragraph conversion
                            bodyHtml = `<p>${post.content.replace(/\n/g, '</p><p>')}</p>`;
                        }
                    } catch (err) {
                        console.warn('Markdown parsing failed:', err);
                        bodyHtml = `<p>${post.content}</p>`;
                    }
                }

                // --- Assemble full HTML ---
                container.innerHTML = `
                    <!-- Back button (top) -->
                    <div class="back-to-portfolio-wrapper">
                        <a href="/blog.html" class="back-to-portfolio" aria-label="Back to blog list">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Blog
                        </a>
                    </div>

                    ${coverHtml}
                    <h1 class="detail-title">${post.title || 'Untitled'}</h1>
                    ${dateHtml}
                    ${tagsHtml}

                    <div class="detail-body">${bodyHtml}</div>

                    ${galleryHtml}
                    ${videoHtml}
                    ${certHtml}

                    <!-- Footer with back button -->
                    <div class="detail-footer">
                        <span class="footer-note">
                            <i class="fas fa-feather-alt" aria-hidden="true"></i> Published via Irtija's Admin Panel
                        </span>
                        <a href="/blog.html" class="back-to-portfolio" style="margin:0;" aria-label="Back to blog list">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Blog
                        </a>
                    </div>
                `;
            }

            // ============================================================
            //  6.  BOOTSTRAP
            // ============================================================

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderDetail);
            } else {
                renderDetail();
            }

        })();
    </script>

</body>
</html>
