# ============================================================
#  DECAP CMS CONFIGURATION
#  Professional build for Irtija's Portfolio
#  Images stored in: pic/blog/
#  Blog posts stored as Markdown in: src/posts/
# ============================================================

backend:
  name: github
  repo: YOUR_USERNAME/YOUR_REPO_NAME
  branch: main
  # Optional: if you use a different branch, change it above

# ---------------------- MEDIA SETTINGS ----------------------
media_folder: "pic/blog"          # where uploaded images are saved
public_folder: "/pic/blog"        # how images are referenced in URLs

# ---------------------- COLLECTIONS --------------------------
collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    # Sort by date descending in the admin list
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "With Video"
        field: videoURL
        pattern: '.+'
      - label: "With Certificate"
        field: certificate
        pattern: '.+'
    fields:
      # --- BASIC INFO ---
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        hint: "The main headline of your blog post."

      - label: "Slug (URL)"
        name: "slug"
        widget: "string"
        required: true
        hint: "URL-friendly identifier — e.g., phoenix-summit-2026 (no spaces)."
        pattern: ["^[a-z0-9-]+$", "Use only lowercase letters, numbers, and hyphens."]

      - label: "Event / Publication Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
        hint: "The date of the event or when you published this post."

      # --- MEDIA ---
      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: true
        hint: "The large image displayed on the blog card and at the top of the detail page."
        media_library:
          config:
            max_file_size: 5120000  # 5MB limit

      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Add additional images to show in a grid on the detail page."
        field:
          label: "Image"
          name: "image"
          widget: "image"
          media_library:
            config:
              max_file_size: 5120000

      # --- CONTENT ---
      - label: "Preview Text"
        name: "previewText"
        widget: "text"
        required: true
        hint: "This short text appears when someone hovers over the blog card. Write a teaser."
        default: "Click to read more about this journey."

      - label: "Full Description"
        name: "body"
        widget: "markdown"
        required: true
        hint: "The main content of your blog post. Supports Markdown, images, lists, and more."
        editor:
          preview: true

      # --- EXTRAS ---
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: ["CTF"]
        hint: "Add topic tags — e.g., CTF, Conference, Workshop, Research, Bug Bounty."
        field:
          label: "Tag"
          name: "tag"
          widget: "string"
          pattern: ["^[a-zA-Z0-9 -]+$", "Alphanumeric only."]

      - label: "Video URL (YouTube)"
        name: "videoURL"
        widget: "string"
        required: false
        hint: "Paste a YouTube watch link (e.g., https://youtu.be/xxxx or https://youtube.com/watch?v=xxxx). It will auto-embed."

      - label: "Certificate / Document Link"
        name: "certificate"
        widget: "string"
        required: false
        hint: "URL to a PDF or image of your certificate (e.g., Google Drive share link or direct file URL)."

    # -------------------- SUMMARY VIEW (admin list) --------------------
    summary: "📄 {{title}} — {{date}}"
    preview_path: "blog-detail.html?slug={{slug}}"
    preview_path_date_field: "date"

# ============================================================
#  OPTIONAL: Enable editorial workflow (drafts)
#  Uncomment the line below if you want draft/publish states.
# ============================================================
# publish_mode: editorial_workflow
