<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found · IrtiJa</title>

    <!-- SEO Meta -->
    <meta name="description" content="The page you're looking for doesn't exist. Return to the IrtiJa portfolio homepage." />
    <meta name="robots" content="noindex, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Page Not Found · IrtiJa" />
    <meta property="og:description" content="The page you're looking for doesn't exist. Return to the IrtiJa portfolio homepage." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://irtizaa6x.github.io/404.html" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="irtija.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ============================================================
           404 PAGE — COMPLETE STYLES (self-contained)
           ============================================================ */

        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #004643;
            --primary-light: #1A7A74;
            --primary-dark: #002B29;
            --gold: #D4A853;
            --gold-light: #E8D5A8;
            --sand: #F0EDE5;
            --sand-light: #F5F2EA;
            --bg-card: #FCFAF5;
            --bg-body: #F0EDE5;
            --text-primary: #1A1A1A;
            --text-secondary: #4A4A4A;
            --text-muted: #7A7A7A;
            --shadow-glow: 0 8px 32px rgba(212, 168, 83, 0.12);
            --radius: 16px;
            --radius-full: 9999px;
            --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --gradient-gold: linear-gradient(135deg, #D4A853, #B8923A);
            --gradient-primary: linear-gradient(135deg, #004643, #1A7A74);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-secondary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ----- Animated Background ----- */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(212, 168, 83, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(26, 122, 116, 0.04) 0%, transparent 50%),
                var(--bg-body);
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--gold);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--primary-light);
            bottom: -80px;
            left: -80px;
            animation-delay: 4s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: var(--primary);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 8s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -20px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.9);
            }
            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        /* Subtle grid pattern overlay */
        .page-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(213, 207, 196, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(213, 207, 196, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ----- Main Card ----- */
        .error-card {
            position: relative;
            z-index: 1;
            max-width: 640px;
            width: 100%;
            background: rgba(252, 250, 245, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 3rem 2.5rem;
            text-align: center;
            border: 1px solid rgba(213, 207, 196, 0.20);
            box-shadow: 0 16px 64px rgba(0, 70, 67, 0.04);
            animation: cardEntry 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ----- Illustration ----- */
        .illustration {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration svg {
            width: 180px;
            height: 180px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        /* ----- Content ----- */
        .error-code {
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gold);
            background: rgba(212, 168, 83, 0.08);
            padding: 0.2rem 1rem;
            border-radius: var(--radius-full);
            margin-bottom: 0.75rem;
            border: 1px solid rgba(212, 168, 83, 0.06);
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.15;
        }

        .error-title .gold {
            color: var(--gold);
        }

        .error-message {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.7;
            max-width: 420px;
            margin: 0 auto 1.5rem;
        }

        .error-message strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ----- Actions ----- */
        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition);
            min-height: 48px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 70, 67, 0.12);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 70, 67, 0.18);
            color: #fff;
        }

        .btn-primary i {
            font-size: 0.85rem;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-light, #D5CFC4);
        }

        .btn-ghost:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-ghost i {
            font-size: 0.85rem;
        }

        /* ----- Search ----- */
        .search-wrapper {
            position: relative;
            max-width: 380px;
            margin: 0 auto;
        }

        .search-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.8rem;
            border: 2px solid rgba(213, 207, 196, 0.30);
            border-radius: var(--radius-full);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: all var(--transition);
            outline: none;
        }

        .search-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .search-wrapper input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 168, 83, 0.06);
        }

        .search-wrapper .search-submit {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--gradient-gold);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .search-wrapper .search-submit:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 16px rgba(212, 168, 83, 0.20);
        }

        /* ----- Footer note ----- */
        .error-footer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .error-footer .brand-link {
            color: var(--text-primary);
            font-weight: 700;
            text-decoration: none;
            transition: color var(--transition);
        }

        .error-footer .brand-link:hover {
            color: var(--gold);
        }

        .error-footer .gold-dot {
            color: var(--gold);
        }

        /* ----- Responsive ----- */
        @media (max-width: 640px) {
            .error-card {
                padding: 2rem 1.5rem;
            }

            .illustration svg {
                width: 130px;
                height: 130px;
            }

            .error-title {
                font-size: 1.8rem;
            }

            .error-message {
                font-size: 0.95rem;
            }

            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .error-actions .btn {
                width: 100%;
                max-width: 280px;
            }

            .search-wrapper {
                max-width: 100%;
            }

            .orb-1 {
                width: 200px;
                height: 200px;
            }
            .orb-2 {
                width: 150px;
                height: 150px;
            }
            .orb-3 {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 400px) {
            .error-card {
                padding: 1.5rem 1rem;
            }

            .illustration svg {
                width: 100px;
                height: 100px;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 0.85rem;
            }

            .btn {
                font-size: 0.8rem;
                padding: 0.6rem 1.25rem;
                min-height: 42px;
            }
        }

        /* ----- Reduced motion ----- */
        @media (prefers-reduced-motion: reduce) {
            .orb,
            .illustration svg,
            .error-card {
                animation: none !important;
            }

            .orb {
                display: none;
            }
        }

        /* ----- Dark mode support (optional) ----- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #1a1a1a;
                --bg-card: #242424;
                --text-primary: #e8e8e8;
                --text-secondary: #b0b0b0;
                --text-muted: #888;
            }

            .page-wrapper {
                background:
                    radial-gradient(ellipse at 20% 30%, rgba(212, 168, 83, 0.04) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 70%, rgba(26, 122, 116, 0.03) 0%, transparent 50%),
                    var(--bg-body);
            }

            .error-card {
                background: rgba(36, 36, 36, 0.92);
                border-color: rgba(255, 255, 255, 0.04);
            }

            .error-message {
                color: var(--text-muted);
            }

            .search-wrapper input {
                background: var(--bg-body);
                color: var(--text-primary);
                border-color: rgba(255, 255, 255, 0.06);
            }

            .search-wrapper input:focus {
                border-color: var(--gold);
            }

            .btn-ghost {
                border-color: rgba(255, 255, 255, 0.10);
                color: var(--text-secondary);
            }

            .btn-ghost:hover {
                background: var(--gold);
                color: #1a1a1a;
                border-color: var(--gold);
            }

            .page-wrapper::before {
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- Animated Orbs -->
        <div class="orb orb-1" aria-hidden="true"></div>
        <div class="orb orb-2" aria-hidden="true"></div>
        <div class="orb orb-3" aria-hidden="true"></div>

        <!-- Error Card -->
        <main class="error-card" role="main" aria-labelledby="error-title">

            <!-- Illustration -->
            <div class="illustration" aria-hidden="true">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Compass/Map pin with a magnifying glass - represents "lost" but in a tech/security context -->
                    <circle cx="100" cy="100" r="88" stroke="#D4A853" stroke-width="2" stroke-dasharray="6 6" opacity="0.15" />
                    <circle cx="100" cy="100" r="72" stroke="#D4A853" stroke-width="1.5" opacity="0.08" />

                    <!-- Magnifying glass handle -->
                    <line x1="142" y1="142" x2="174" y2="174" stroke="#D4A853" stroke-width="5" stroke-linecap="round" />

                    <!-- Magnifying glass lens -->
                    <circle cx="100" cy="100" r="48" stroke="#D4A853" stroke-width="4" fill="rgba(212,168,83,0.04)" />
                    <circle cx="100" cy="100" r="36" stroke="#D4A853" stroke-width="1.5" fill="rgba(212,168,83,0.02)" />

                    <!-- Question mark inside -->
                    <text x="100" y="112" text-anchor="middle" font-family="'Playfair Display', serif" font-size="42" font-weight="700" fill="#D4A853" opacity="0.8">?</text>

                    <!-- Small dots around (stars / particles) -->
                    <circle cx="40" cy="50" r="3" fill="#D4A853" opacity="0.15" />
                    <circle cx="160" cy="40" r="2.5" fill="#D4A853" opacity="0.12" />
                    <circle cx="170" cy="120" r="2" fill="#D4A853" opacity="0.10" />
                    <circle cx="30" cy="140" r="2.5" fill="#D4A853" opacity="0.08" />
                    <circle cx="60" cy="170" r="2" fill="#D4A853" opacity="0.06" />
                    <circle cx="145" cy="170" r="2" fill="#D4A853" opacity="0.06" />

                    <!-- Shield icon (security theme) inside the glass -->
                    <path d="M94 76 L106 76 L106 88 L100 96 L94 88 L94 76Z" stroke="#D4A853" stroke-width="1.5" opacity="0.20" fill="rgba(212,168,83,0.04)" />

                    <!-- Small directional arrows -->
                    <path d="M68 68 L76 60 M132 68 L124 60 M68 132 L76 140 M132 132 L124 140" stroke="#D4A853" stroke-width="1.5" stroke-linecap="round" opacity="0.10" />
                </svg>
            </div>

            <!-- Content -->
            <span class="error-code">404 Error</span>
            <h1 class="error-title" id="error-title">
                Page Not <span class="gold">Found</span>
            </h1>
            <p class="error-message">
                Oops! The page you're looking for seems to have wandered off.
                Don't worry — let's get you back on track.
            </p>

            <!-- Actions -->
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <a href="blog.html" class="btn btn-ghost">
                    <i class="fas fa-book-open"></i> Visit Blog
                </a>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="errorSearch" placeholder="Search the site..." aria-label="Search the site" />
                <button class="search-submit" id="searchSubmit" aria-label="Submit search">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <!-- Footer note -->
            <div class="error-footer">
                <a href="index.html" class="brand-link">Irti<span class="gold-dot">Ja</span></a>
                <span> · Built with care. Let's find your way home.</span>
            </div>

        </main>
    </div>

    <!-- ============================================================
         SEARCH FUNCTIONALITY
         ============================================================ -->
    <script>
        (function() {
            'use strict';

            const searchInput = document.getElementById('errorSearch');
            const searchSubmit = document.getElementById('searchSubmit');

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    // If empty, focus the input
                    searchInput.focus();
                    return;
                }

                // Redirect to Google search with site: filter
                // This searches the current site
                const siteUrl = window.location.origin;
                const searchUrl =
                    `https://www.google.com/search?q=site:${siteUrl} ${encodeURIComponent(query)}`;
                window.open(searchUrl, '_blank');
            }

            // Search on button click
            if (searchSubmit) {
                searchSubmit.addEventListener('click', performSearch);
            }

            // Search on Enter key
            if (searchInput) {
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        performSearch();
                    }
                });
            }

            // Focus the search input on load (optional)
            if (searchInput) {
                setTimeout(() => {
                    searchInput.focus();
                }, 800);
            }

        })();
    </script>

</body>
</html>
